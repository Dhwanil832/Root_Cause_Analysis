[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progressive-rca-research"
version = "0.3.0"
description = "Modular research prototype for progressive evidence-grounded industrial incident investigation"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rca-investigate = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = {find = {include = ["intake*", "reasoning*", "revision*", "orchestration*", "integrations*", "shared*", "evaluation*"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
